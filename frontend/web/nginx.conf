server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API traffic is routed by Envoy Gateway's Gateway API HTTPRoute. Nginx only
  # serves the Vue bundle and SPA fallback inside the web Deployment.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
