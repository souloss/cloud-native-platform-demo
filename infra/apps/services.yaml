---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gofr-demo
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloud-native-platform-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cloud-native-platform-demo
    spec:
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: web } }
      containers:
        - name: web
          image: k3s-gofr/web:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /, port: http }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          # 官方 nginx 入口脚本会在绑定非特权 8080 监听器前修复缓存目录所有权。
          # 初始化阶段保留镜像默认能力集，同时关闭权限提升；未来将 chown 步骤移到
          # 构建阶段后，可以再使用强化镜像删除全部能力。
          securityContext: { allowPrivilegeEscalation: false }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: gofr-demo
  labels: { app: web, app.kubernetes.io/name: web, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec: { selector: { app: web }, ports: [{ name: http, port: 8080, targetPort: http }] }
