# 无状态应用工作负载。通用标签、滚动更新策略、拓扑分布和探针都是工作负载契约的一部分；
# 将它们集中在这里，避免在启动脚本中重复部署行为。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: gofr-demo
  labels:
    app: catalog
    app.kubernetes.io/name: catalog
    app.kubernetes.io/component: workload
    app.kubernetes.io/part-of: cloud-native-platform-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: catalog } }
  template:
    metadata:
      labels:
        app: catalog
        app.kubernetes.io/name: catalog
        app.kubernetes.io/component: workload
        app.kubernetes.io/part-of: cloud-native-platform-demo
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "2121" }
    spec:
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: catalog } }
      containers:
        - name: catalog
          image: k3s-gofr/catalog:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: observability } }]
          env:
            - { name: SERVICE_VERSION, value: dev }
            - { name: APP_NAME, value: k3s-gofr-catalog }
            - { name: DB_DIALECT, value: mysql }
            - { name: DB_HOST, value: mysql }
            - { name: DB_PORT, value: "3306" }
            - { name: DB_NAME, value: demo }
            - { name: DB_USER, value: demo }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: mysql, key: MYSQL_PASSWORD } } }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
          ports: [{ name: http, containerPort: 8000 }, { name: metrics, containerPort: 2121 }]
          startupProbe: { httpGet: { path: /.well-known/health, port: http }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /.well-known/health, port: http }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /.well-known/alive, port: http }, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: gofr-demo
  labels: { app: catalog, app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec: { selector: { app: catalog }, ports: [{ name: http, port: 8000, targetPort: http }, { name: metrics, port: 2121, targetPort: metrics }] }
---
