          ports: [{ name: http, containerPort: 8000 }, { name: metrics, containerPort: 2121 }]
          readinessProbe: { httpGet: { path: /.well-known/health, port: http }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /.well-known/alive, port: http }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: gofr-demo }
spec: { selector: { app: orders }, ports: [{ name: http, port: 8000, targetPort: http }, { name: metrics, port: 2121, targetPort: metrics }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: gofr-demo, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: k3s-gofr/web:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 2 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: gofr-demo }
spec: { selector: { app: web }, ports: [{ name: http, port: 8080, targetPort: http }] }
