      containers:
        - name: orders
          image: k3s-gofr/orders:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: observability } }]
          env:
            - { name: SERVICE_VERSION, value: dev }
            - { name: APP_NAME, value: k3s-gofr-orders }
            - { name: CATALOG_URL, value: http://catalog:8000 }
            - { name: DB_DIALECT, value: postgres }
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: demo }
            - { name: DB_USER, value: demo }
