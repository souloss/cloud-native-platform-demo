apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: public-gateway, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gofr-demo
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: application-routes, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  parentRefs:
    - name: public
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/catalog
      backendRefs:
        - name: catalog
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: orders
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-telemetry
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: browser-telemetry, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  parentRefs:
    - name: public
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1/traces }
        - path: { type: PathPrefix, value: /v1/logs }
        - path: { type: PathPrefix, value: /v1/metrics }
      backendRefs:
        - name: gateway-collector
          port: 4318
