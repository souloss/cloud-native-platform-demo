apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-proxy
  namespace: gofr-demo
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: public-gateway, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gofr-demo
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: application-routes, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  parentRefs:
    - name: public
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/catalog
      backendRefs:
        - name: catalog
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: orders
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-telemetry
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: browser-telemetry, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  parentRefs:
    - name: public
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1/traces }
        - path: { type: PathPrefix, value: /v1/logs }
        - path: { type: PathPrefix, value: /v1/metrics }
      backendRefs:
        - name: otel-collector
          port: 4318
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: browser-telemetry-rate-limit
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: browser-telemetry-rate-limit, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: browser-telemetry
  rateLimit:
    local:
      rules:
        - limit: { requests: 200, unit: Second }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: browser-telemetry-cors
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: browser-telemetry-cors, app.kubernetes.io/component: edge, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: browser-telemetry
  cors:
    allowOrigins:
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:18081
      - http://127.0.0.1:18081
    allowMethods: [POST, OPTIONS]
    allowHeaders: [authorization, content-type, traceparent, tracestate]
    exposeHeaders: [x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset]
