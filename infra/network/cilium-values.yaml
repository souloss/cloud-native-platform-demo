# Cilium 是 k3d 演示的集群 CNI 和服务数据面。
# 集群创建时已关闭 Flannel 和 k3s 网络策略。
operator:
  replicas: 1
ipam:
  mode: kubernetes
# Gateway API requires kube-proxy replacement. scripts/up.sh creates k3d
# nodes with kube-proxy disabled and injects the server address below.
kubeProxyReplacement: true
# scripts/up.sh sets these values from the current k3d server address, so the
# values file remains valid when Docker allocates a different bridge subnet.
routingMode: tunnel
tunnelProtocol: vxlan
l7Proxy: true
gatewayAPI:
  # Cilium is the single Gateway API controller for this blueprint.
  enabled: true
  enableAppProtocol: true
hubble:
  enabled: true
  relay:
    enabled: false
  ui:
    enabled: false
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - httpV2
prometheus:
  enabled: true
operatorPrometheus:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
