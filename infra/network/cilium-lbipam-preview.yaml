# k3d has no cloud LoadBalancer controller. This small address block lets
# Cilium assigns an address to the Gateway Service so Gateway status reaches
# Programmed; the preview script bridges its NodePort to localhost.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: preview
spec:
  blocks:
    - cidr: 172.26.0.240/28
---
# Cilium's Gateway Service has no selector, which is correct for the
# controller-managed dataplane but prevents kubectl port-forward. This
# selector-backed local-only bridge lets the preview scripts expose the same
# Cilium Envoy listener on localhost while leaving the production Gateway untouched.
apiVersion: v1
kind: Service
metadata:
  name: cilium-envoy-preview
  namespace: kube-system
spec:
  selector:
    k8s-app: cilium-envoy
  ports:
    - name: http
      port: 80
      targetPort: 80
