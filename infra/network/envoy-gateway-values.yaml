# Envoy Gateway 是 Gateway API 控制器，负责为 Gateway 资源创建的 Envoy 代理 Deployment；
# 应用 Gateway 使用 ClusterIP Service，只由 scripts/up.sh 通过 kubectl port-forward 暴露。
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
deployment:
  envoyGateway:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
