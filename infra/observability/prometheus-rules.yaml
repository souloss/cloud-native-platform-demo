apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: gofr-demo
  labels:
    app.kubernetes.io/name: prometheus-rules
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: cloud-native-platform-demo
data:
  gofr.rules.yaml: |
    groups:
      - name: cloud-native-platform-demo.gofr
        interval: 30s
        rules:
          # These recording rules are intentionally label-light. They remain
          # useful when GoFr changes an individual handler label, while the
          # dashboard can still query stable project-owned metric names.
          - record: gofr:http_responses:rate5m
            expr: sum(rate(app_http_response_count{job="gofr-services"}[5m]))
          - record: gofr:http_response_duration_seconds:p95
            expr: histogram_quantile(0.95, sum by (le) (rate(app_http_response_bucket{job="gofr-services"}[5m])))
