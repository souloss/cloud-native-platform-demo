# Prometheus 在本地演示中刻意保持自包含。Pod 发现机制让 RBAC 范围保持最小，recording rule
# 则提供不依赖 GoFr 原始指标标签集合的稳定运维查询。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: cloud-native-platform-demo }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-gofr-demo }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-gofr-demo }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-gofr-demo }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: gofr-demo }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus, namespace: gofr-demo }
data:
  prometheus.yml: |
    global: { scrape_interval: 15s, evaluation_interval: 15s }
    rule_files: ['/etc/prometheus/rules/*.yaml']
    scrape_configs:
      - job_name: prometheus
        static_configs: [{ targets: ['localhost:9090'] }]
      - job_name: gofr-services
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - { source_labels: [__meta_kubernetes_namespace], action: keep, regex: gofr-demo }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+) }
          - { source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: '([^:]+)(?::\\d+)?;(\\d+)', replacement: '$1:$2', target_label: __address__ }
          - { source_labels: [__meta_kubernetes_namespace], action: replace, target_label: namespace }
          - { source_labels: [__meta_kubernetes_pod_label_app], action: replace, target_label: app }
      - job_name: envoy-gateway
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - { source_labels: [__meta_kubernetes_namespace], action: keep, regex: envoy-gateway-system }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+) }
          - { source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, target_label: __address__, regex: '([^:]+)(?::\\d+)?;(\\d+)', replacement: '$1:$2' }
          - { source_labels: [__meta_kubernetes_namespace], action: replace, target_label: namespace }
          - { source_labels: [__meta_kubernetes_pod_label_gateway_envoyproxy_io_owning_gateway_name], action: replace, target_label: gateway }
      - job_name: otel-collector
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_label_app], action: keep, regex: otel-collector }
          - { source_labels: [__meta_kubernetes_namespace], action: keep, regex: gofr-demo }
          - { source_labels: [__address__], action: replace, target_label: __address__, regex: '([^:]+)(?::\d+)?', replacement: '$1:8888' }
          - { source_labels: [__meta_kubernetes_namespace], action: replace, target_label: namespace }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: gofr-demo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus, app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: cloud-native-platform-demo }
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.8.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=6h]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus } }
        - { name: rules, configMap: { name: prometheus-rules } }
        - { name: data, persistentVolumeClaim: { claimName: prometheus } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: gofr-demo, labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: cloud-native-platform-demo } }
spec: { selector: { app: prometheus }, ports: [{ name: http, port: 9090, targetPort: http }] }
