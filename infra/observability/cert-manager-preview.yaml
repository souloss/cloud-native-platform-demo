# Local-only cert-manager acceptance resources. Production uses the ACME
# ClusterIssuers in infra/production/platform/issuers.yaml instead.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: preview-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-gateway
  namespace: gofr-demo
spec:
  secretName: preview-gateway-tls
  issuerRef:
    name: preview-selfsigned
    kind: ClusterIssuer
  dnsNames:
    - preview.localhost
