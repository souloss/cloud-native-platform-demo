# Collector 是本地遥测汇聚点。服务间信号通过内部 gRPC 接收器进入，浏览器信号通过
# 受 Bearer 校验和 CORS 保护的 HTTP 接收器进入；Collector 只采集演示命名空间的 Pod 日志，
# 并将三类信号转发到可配置的 OTLP 后端。健康端点独立于下游后端，确保采集失败仍然可以排查。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: gofr-demo
  labels: { app: otel-collector, app.kubernetes.io/name: otel-collector, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: cloud-native-platform-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata:
      labels: { app: otel-collector, app.kubernetes.io/name: otel-collector, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: cloud-native-platform-demo }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8888" }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          args: [--config=/conf/config.yaml]
          env:
            - { name: HYPERDX_API_KEY, valueFrom: { secretKeyRef: { name: hyperdx, key: api-key } } }
            - { name: HYPERDX_OTLP_ENDPOINT, valueFrom: { secretKeyRef: { name: hyperdx, key: otlp-endpoint } } }
            - { name: BROWSER_OTLP_API_KEY, valueFrom: { secretKeyRef: { name: hyperdx, key: browser-api-key } } }
          ports: [{ name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }, { name: metrics, containerPort: 8888 }]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
          startupProbe: { tcpSocket: { port: otlp-grpc }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { tcpSocket: { port: otlp-grpc }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { tcpSocket: { port: otlp-grpc }, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 250m, memory: 256Mi } }
      volumes:
        - { name: config, configMap: { name: otel-collector-config } }
        - { name: pod-logs, hostPath: { path: /var/log/pods, type: Directory } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: gofr-demo }
data:
  config.yaml: |
    receivers:
      otlp/internal:
        protocols:
          grpc: { endpoint: '0.0.0.0:4317' }
      otlp/browser:
        protocols:
          http:
            endpoint: '0.0.0.0:4318'
            include_metadata: true
            cors:
              allowed_origins: ['http://localhost:8080', 'http://127.0.0.1:8080', 'http://localhost:18081', 'http://127.0.0.1:18081']
              allowed_headers: ['authorization', 'content-type', 'traceparent', 'tracestate']
            auth:
              authenticator: bearertokenauth/browser
      filelog:
        include: [/var/log/pods/gofr-demo_*/*/*.log]
        start_at: beginning
        include_file_path: true
        operators:
          - type: container
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 220 }
      batch:
        metadata_keys: [authorization]
      attributes/redact:
        actions:
          - { key: http.request.header.authorization, action: delete }
          - { key: http.request.header.cookie, action: delete }
          - { key: user.email, action: delete }
      transform/log-service:
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["k8s.namespace.name"] == "gofr-demo" and attributes["k8s.container.name"] != nil
    exporters:
      otlphttp/hyperdx:
        endpoint: '${env:HYPERDX_OTLP_ENDPOINT}'
        headers: { authorization: '${env:HYPERDX_API_KEY}' }
      debug: { verbosity: basic }
    extensions:
      bearertokenauth/browser:
        scheme: ''
        token: '${env:BROWSER_OTLP_API_KEY}'
    service:
      extensions: [bearertokenauth/browser]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces: { receivers: [otlp/internal, otlp/browser], processors: [memory_limiter, attributes/redact, batch], exporters: [otlphttp/hyperdx, debug] }
        metrics: { receivers: [otlp/internal, otlp/browser], processors: [memory_limiter, attributes/redact, batch], exporters: [otlphttp/hyperdx, debug] }
        logs: { receivers: [otlp/internal, otlp/browser, filelog], processors: [memory_limiter, attributes/redact, transform/log-service, batch], exporters: [otlphttp/hyperdx, debug] }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: gofr-demo, labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: cloud-native-platform-demo } }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics, port: 8888, targetPort: metrics }
