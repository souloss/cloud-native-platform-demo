# Helm 可用时，scripts/up.sh 会从官方 OCI chart 安装 Kite。本目录中的回退清单与这些值保持一致。
# 参考：oci://ghcr.io/kite-org/charts/kite
replicaCount: 1
image:
  repository: ghcr.io/kite-org/kite
  pullPolicy: IfNotPresent
deploymentStrategy:
  type: Recreate
anonymousUserEnabled: true
encryptKey: gofr-demo-kite-encryption-key-change-me
jwtSecret: gofr-demo-kite-jwt-secret-change-me
db:
  type: sqlite
  sqlite:
    persistence:
      pvc:
        enabled: true
        size: 1Gi
config:
  enabled: true
  superUser:
    username: admin
    password: kite-admin
  clusters:
    - name: in-cluster
      description: k3d demo cluster
      inCluster: true
      default: true
extraEnvs:
  - name: ENABLE_ANALYTICS
    value: "false"
