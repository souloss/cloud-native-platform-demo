# Helm 未安装时使用的本地回退方案。
# 它与 kite.yaml 中的值保持一致，使控制台在全新的 k3d 集群中仍然可用，
# 不会退回到 Kite 仅包含认证功能的 install.yaml。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kite
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kite
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: kite-secret
  namespace: kube-system
type: Opaque
stringData:
  JWT_SECRET: gofr-demo-kite-jwt-secret-change-me
  KITE_ENCRYPT_KEY: gofr-demo-kite-encryption-key-change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: kite-config
  namespace: kube-system
type: Opaque
stringData:
  config.yaml: |
    superUser:
      username: admin
      password: kite-admin
    clusters:
      - name: in-cluster
        description: k3d demo cluster
        inCluster: true
        default: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kite-storage
  namespace: kube-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kite
  namespace: kube-system
  labels:
    app: kite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kite
  template:
    metadata:
      labels:
        app: kite
    spec:
      serviceAccountName: kite
      containers:
        - name: kite
          image: ghcr.io/kite-org/kite:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/kite"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: kite-secret
          env:
            - name: ANONYMOUS_USER_ENABLED
              value: "true"
            - name: ENABLE_ANALYTICS
              value: "false"
            - name: DB_TYPE
              value: sqlite
            - name: DB_DSN
              value: /data/kite.db
            - name: KITE_CONFIG_FILE
              value: /etc/kite/config.yaml
          volumeMounts:
            - name: kite-storage
              mountPath: /data
            - name: kite-config
              mountPath: /etc/kite
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: kite-storage
          persistentVolumeClaim:
            claimName: kite-storage
        - name: kite-config
          secret:
            secretName: kite-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: kite
  namespace: kube-system
  labels:
    app: kite
spec:
  type: ClusterIP
  selector:
    app: kite
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
