# Production Cilium profile. This profile is intentionally separate from the
# k3d profile: kube-proxy replacement and native routing must be decided when
# the cluster is created and cannot be safely toggled on a running cluster.
kubeProxyReplacement: "true"
kubeProxyReplacementHealthzBindAddr: "0.0.0.0:10256"
k8sServiceHost: 10.0.0.10 # private API load balancer/VIP; replace per environment
k8sServicePort: 6443

ipam:
  mode: kubernetes
routingMode: native
ipv4NativeRoutingCIDR: 10.42.0.0/16 # must not overlap the cloud VPC
autoDirectNodeRoutes: true
enableIPv4Masquerade: true
l7Proxy: true
operator:
  replicas: 2

gatewayAPI:
  enabled: true
  enableAppProtocol: true
  enableAlpn: true
  externalTrafficPolicy: Local
  gatewayClass:
    create: false # the Git-managed GatewayClass is applied after the CRDs

envoy:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - httpV2

prometheus:
  enabled: true
operatorPrometheus:
  enabled: true

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
