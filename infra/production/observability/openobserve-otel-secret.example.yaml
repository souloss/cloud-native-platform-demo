# The authorization value is the HTTP Basic value expected by OpenObserve's
# OTLP endpoint: `Basic ` followed by base64(email:password). Generate it in a
# secret manager; do not commit the rendered Secret.
apiVersion: v1
kind: Secret
metadata:
  name: openobserve-otel
  namespace: observability
type: Opaque
stringData:
  # Use the in-cluster router by default. Replace this value for a managed
  # OpenObserve endpoint.
  endpoint: http://openobserve-router.openobserve.svc.cluster.local:5080/api/default
  authorization: Basic REPLACE_WITH_BASE64_ROOT_EMAIL_AND_PASSWORD
  browser-ingestion-key: REPLACE_WITH_A_SEPARATE_BROWSER_INGESTION_TOKEN
