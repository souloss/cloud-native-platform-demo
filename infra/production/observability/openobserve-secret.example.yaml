# Copy this file to a secret manager or render it with SOPS/External Secrets.
# The chart reads these keys when externalSecret.enabled=true.
apiVersion: v1
kind: Secret
metadata:
  name: openobserve-secrets
  namespace: openobserve
type: Opaque
stringData:
  ZO_ROOT_USER_EMAIL: sre@example.com
  ZO_ROOT_USER_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
  ZO_S3_ACCESS_KEY: REPLACE_WITH_S3_ACCESS_KEY
  ZO_S3_SECRET_KEY: REPLACE_WITH_S3_SECRET_KEY
  ZO_META_POSTGRES_DSN: postgres://openobserve:REPLACE@postgres.example.internal:5432/openobserve?sslmode=require
  ZO_RUM_CLIENT_TOKEN: REPLACE_WITH_OPENOBSERVE_RUM_CLIENT_TOKEN
