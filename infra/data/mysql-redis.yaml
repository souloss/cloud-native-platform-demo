apiVersion: v1
kind: Secret
metadata: { name: mysql, namespace: gofr-demo }
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root-password
  MYSQL_DATABASE: demo
  MYSQL_USER: demo
  MYSQL_PASSWORD: demo-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mysql, namespace: gofr-demo }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: gofr-demo, labels: { app: mysql } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: mysql } }]
          ports: [{ name: mysql, containerPort: 3306 }]
          readinessProbe: { exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -u demo -pdemo-password --silent'] }, initialDelaySeconds: 15, periodSeconds: 5 }
          livenessProbe: { exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -u demo -pdemo-password --silent'] }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 768Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mysql } }]
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: gofr-demo }
spec: { selector: { app: mysql }, ports: [{ name: mysql, port: 3306, targetPort: mysql }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: gofr-demo, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: [redis-server, --appendonly, "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { exec: { command: [redis-cli, ping] }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: gofr-demo }
spec: { selector: { app: redis }, ports: [{ name: redis, port: 6379, targetPort: redis }] }
