apiVersion: v1
kind: Secret
metadata: { name: postgres, namespace: gofr-demo }
type: Opaque
stringData: { POSTGRES_PASSWORD: demo-password }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres, namespace: gofr-demo }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: gofr-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: demo }
            - { name: POSTGRES_USER, value: demo }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } } }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, demo, -d, demo] }, initialDelaySeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: gofr-demo }
spec: { selector: { app: postgres }, ports: [{ name: postgres, port: 5432, targetPort: postgres }] }
