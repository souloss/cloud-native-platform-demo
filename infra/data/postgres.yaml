# 有状态演示依赖。它们在 k3d 中刻意保持单副本并使用 local-path；探针和优雅终止仍然
# 模拟托管生产数据库应提供的就绪契约。
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: gofr-demo
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: data, app.kubernetes.io/part-of: cloud-native-platform-demo }
type: Opaque
stringData: { POSTGRES_PASSWORD: demo-password }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres, namespace: gofr-demo }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: gofr-demo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres, app.kubernetes.io/name: postgres, app.kubernetes.io/component: data, app.kubernetes.io/part-of: cloud-native-platform-demo }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: demo }
            - { name: POSTGRES_USER, value: demo }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } } }
          ports: [{ name: postgres, containerPort: 5432 }]
          startupProbe: { exec: { command: [pg_isready, -U, demo, -d, demo] }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { exec: { command: [pg_isready, -U, demo, -d, demo] }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { exec: { command: [pg_isready, -U, demo, -d, demo] }, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: gofr-demo, labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: data, app.kubernetes.io/part-of: cloud-native-platform-demo } }
spec: { selector: { app: postgres }, ports: [{ name: postgres, port: 5432, targetPort: postgres }] }
